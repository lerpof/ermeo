name: ermeo_workspace
publish_to: none

environment:
  sdk: ^3.12.0

dev_dependencies:
  melos: 7.7.0
  flutter_lints: ^6.0.0

workspace:
  - apps/ermeo_mobile
  - apps/ermeo_widgetbook
  - packages/ermeo_api
  - packages/ermeo_secure_storage
  - packages/ermeo_ui
  - packages/ermeo_monitoring
  - packages/ermeo_l10n

melos:
  sdkPath: .fvm/flutter_sdk

  scripts:
    analyze:
      description: Run static analysis in all workspace packages.
      run: melos exec -- "dart analyze ."
    test:
      description: Run tests in all workspace packages.
      run: melos exec -- "dart test"
    format:
      description: Format all workspace packages.
      run: melos exec -- "dart format ."
    clean:
      description: Remove build artifacts from all packages.
      run: melos exec -- "flutter clean 2>/dev/null || true"
    generate:tokens:
      description: Regenerate design tokens for ermeo_ui.
      run: melos exec --scope=ermeo_ui -- "dart run tool/generate_tokens.dart"
    generate:l10n:
      description: Regenerate ErLocalizations from ARB files.
      run: |
        melos exec --scope=ermeo_l10n -- "flutter gen-l10n"
        melos exec --scope=ermeo_l10n -- "dart run tool/ensure_generated_coverage_ignore.dart"
    generate:widgetbook:
      description: Regenerate Widgetbook directories for ermeo_widgetbook.
      run: melos exec --scope=ermeo_widgetbook -- "dart run build_runner build -d"
    generate:routes:
      description: Regenerate auto_route files for ermeo_mobile.
      run: melos exec --scope=ermeo_mobile -- "dart run build_runner build --delete-conflicting-outputs"
    generate:icons:
      description: Regenerate dev and prod launcher icons for ermeo_mobile.
      run: |
        melos exec --scope=ermeo_mobile -- "dart run flutter_launcher_icons -f flutter_launcher_icons-prod.yaml"
        melos exec --scope=ermeo_mobile -- "dart run flutter_launcher_icons -f flutter_launcher_icons-dev.yaml"
    run:widgetbook:
      description: Run the Widgetbook catalog in Chrome.
      run: melos exec --scope=ermeo_widgetbook -- "flutter run -d chrome"
    run:mobile:dev:
      description: Run ermeo_mobile with dev entry point, flavor, and dart-defines.
      run: melos exec --scope=ermeo_mobile -- "flutter run --flavor dev -t lib/main_dev.dart --dart-define-from-file=config/dart_defines/dev.json"
    run:mobile:staging:
      description: Run ermeo_mobile with staging entry point (dev native flavor) and dart-defines.
      run: melos exec --scope=ermeo_mobile -- "flutter run --flavor dev -t lib/main_staging.dart --dart-define-from-file=config/dart_defines/staging.json"
    run:mobile:prod:
      description: Run ermeo_mobile with prod entry point, flavor, and dart-defines.
      run: melos exec --scope=ermeo_mobile -- "flutter run --flavor prod -t lib/main_prod.dart --dart-define-from-file=config/dart_defines/prod.json"
    generate:api:
      description: Fetch OpenAPI from running API (GET /openapi.yaml), then regenerate Dio client (requires Java 8+).
      run: |
        bash scripts/fetch-openapi-spec.sh
        melos exec --scope=ermeo_api -- "dart run build_runner build --delete-conflicting-outputs"
