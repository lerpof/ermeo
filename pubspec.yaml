name: beneesse_workspace
publish_to: none

environment:
  sdk: ^3.12.0

dev_dependencies:
  melos: 7.7.0
  flutter_lints: ^6.0.0

workspace:
  - apps/beneesse_mobile
  - apps/beneesse_widgetbook
  - packages/beneesse_api
  - packages/beneesse_ui
  - packages/beneesse_monitoring

melos:
  sdkPath: .fvm/flutter_sdk

  scripts:
    analyze:
      description: Run static analysis in all workspace packages.
      run: melos exec -- "dart analyze ."
    test:
      description: Run tests in all workspace packages.
      run: melos exec -- "dart test"
    format:
      description: Format all workspace packages.
      run: melos exec -- "dart format ."
    clean:
      description: Remove build artifacts from all packages.
      run: melos exec -- "flutter clean 2>/dev/null || true"
    generate:tokens:
      description: Regenerate design tokens for beneesse_ui.
      run: melos exec --scope=beneesse_ui -- "dart run tool/generate_tokens.dart"
    generate:widgetbook:
      description: Regenerate Widgetbook directories for beneesse_widgetbook.
      run: melos exec --scope=beneesse_widgetbook -- "dart run build_runner build -d"
    run:widgetbook:
      description: Run the Widgetbook catalog in Chrome.
      run: melos exec --scope=beneesse_widgetbook -- "flutter run -d chrome"
    run:mobile:dev:
      description: Run beneesse_mobile with dev dart-defines.
      run: melos exec --scope=beneesse_mobile -- "flutter run --dart-define-from-file=config/dart_defines/dev.json"
    run:mobile:prod:
      description: Run beneesse_mobile with prod dart-defines.
      run: melos exec --scope=beneesse_mobile -- "flutter run --dart-define-from-file=config/dart_defines/prod.json"
    run:mobile:localhost:
      description: Run beneesse_mobile against local API (dev env, localhost URL).
      run: melos exec --scope=beneesse_mobile -- "flutter run --dart-define-from-file=config/dart_defines/dev.json --dart-define=BENEESE_API_BASE_URL=http://localhost:8000"
    generate:api:
      description: Fetch OpenAPI from running API (GET /openapi.yaml), then regenerate Dio client (requires Java 8+).
      run: |
        bash scripts/fetch-openapi-spec.sh
        melos exec --scope=beneesse_api -- "dart run build_runner build --delete-conflicting-outputs"
