name: beneesse_workspace
publish_to: none

environment:
  sdk: ^3.12.0

dev_dependencies:
  melos: 7.7.0
  flutter_lints: ^6.0.0

workspace:
  - apps/beneesse_mobile
  - packages/beneesse_api
  - packages/beneesse_ui
  - packages/beneesse_monitoring

melos:
  sdkPath: .fvm/flutter_sdk

  scripts:
    analyze:
      description: Run static analysis in all workspace packages.
      run: melos exec -- "dart analyze ."
    test:
      description: Run tests in all workspace packages.
      run: melos exec -- "dart test"
    format:
      description: Format all workspace packages.
      run: melos exec -- "dart format ."
    clean:
      description: Remove build artifacts from all packages.
      run: melos exec -- "flutter clean 2>/dev/null || true"
    generate:tokens:
      description: Regenerate design tokens for beneesse_ui.
      run: melos exec --scope=beneesse_ui -- "dart run tool/generate_tokens.dart"
