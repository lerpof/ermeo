openapi: 3.1.0
info:
  title: Ermeo API
  version: 1.0.0
  description: |
    REST API for Ermeo / Ermeo. Canonical contract for backend and mobile.
    Stack: FastAPI + PostgreSQL (see backend/openapi/README.md).
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: meta
  - name: health
  - name: auth
  - name: exercises
  - name: workouts
  - name: sessions
  - name: instructors
  - name: assignments
  - name: athletes
paths:
  /openapi.yaml:
    get:
      tags: [meta]
      operationId: getOpenApiDocument
      summary: OpenAPI document
      description: Returns the canonical API contract as YAML.
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 specification
          content:
            application/yaml:
              schema:
                type: string
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags: [auth]
      operationId: loginUser
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshAuth
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /exercises:
    get:
      tags: [exercises]
      operationId: listExercises
      summary: List exercises from the catalog (backend/data/exercises.json)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: bodyPart
          in: query
          schema:
            type: string
        - name: equipment
          in: query
          schema:
            type: string
        - name: target
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Search exercise name (case-insensitive)
          schema:
            type: string
      responses:
        '200':
          description: Exercise catalog page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /exercises/{exerciseId}:
    get:
      tags: [exercises]
      operationId: getExercise
      summary: Get one exercise by catalog id
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema:
            type: string
            description: Id from exercises.json (e.g. "0001")
      responses:
        '200':
          description: Exercise details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workouts:
    get:
      tags: [workouts]
      operationId: listWorkouts
      summary: List workout templates for the current user
      responses:
        '200':
          description: Workout list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [workouts]
      operationId: createWorkout
      summary: Create a workout template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutCreateRequest'
      responses:
        '201':
          description: Workout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /workouts/{workoutId}:
    get:
      tags: [workouts]
      operationId: getWorkout
      summary: Get a workout template by ID
      parameters:
        - $ref: '#/components/parameters/WorkoutId'
      responses:
        '200':
          description: Workout details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Start a workout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        '201':
          description: Session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /sessions/{sessionId}/sets:
    patch:
      tags: [sessions]
      operationId: patchSessionSets
      summary: Update set logs for a session (idempotent by client set id)
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionSetsPatchRequest'
      responses:
        '200':
          description: Sets updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /sessions/{sessionId}/complete:
    post:
      tags: [sessions]
      operationId: completeSession
      summary: Mark a workout session as completed
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /instructors:
    get:
      tags: [instructors]
      operationId: listInstructors
      summary: List instructors (for athletes) or roster context
      responses:
        '200':
          description: Instructor list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructorListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /assignments:
    post:
      tags: [assignments]
      operationId: createAssignment
      summary: Assign an instructor to an athlete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreateRequest'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructorAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /athletes/{athleteId}/sessions:
    get:
      tags: [athletes]
      operationId: listAthleteSessions
      summary: List workout sessions for an athlete (instructor view)
      parameters:
        - $ref: '#/components/parameters/AthleteId'
      responses:
        '200':
          description: Session history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkoutId:
      name: workoutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AthleteId:
      name: athleteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Not allowed for this role or resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: validation_error
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Optional structured details
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    UserRole:
      type: string
      enum: [athlete, instructor, admin]
    RegisterRequest:
      type: object
      required: [email, password, role, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        role:
          $ref: '#/components/schemas/UserRole'
        displayName:
          type: string
          minLength: 1
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          default: bearer
        expiresIn:
          type: integer
          description: Access token lifetime in seconds
    Exercise:
      type: object
      required: [id, name, bodyPart, equipment, target]
      description: Catalog exercise synced from backend/data/exercises.json
      properties:
        id:
          type: string
          description: Stable catalog id (e.g. "0001")
        name:
          type: string
        bodyPart:
          type: string
        equipment:
          type: string
        target:
          type: string
        gifUrl:
          type: string
          format: uri
        secondaryMuscles:
          type: array
          items:
            type: string
        instructions:
          type: array
          items:
            type: string
    ExerciseListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Exercise'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    ExerciseRef:
      type: object
      required: [exerciseId, order]
      properties:
        exerciseId:
          type: string
          description: Catalog id from exercises.json
        name:
          type: string
          description: Optional display override; defaults to catalog name
        order:
          type: integer
          minimum: 0
        targetSets:
          type: integer
          minimum: 1
        targetReps:
          type: integer
          minimum: 1
    WorkoutCreateRequest:
      type: object
      required: [name, exercises]
      properties:
        name:
          type: string
        description:
          type: string
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseRef'
    Workout:
      type: object
      required: [id, name, exercises, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseRef'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkoutListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Workout'
    SetLogInput:
      type: object
      required: [clientSetId, exerciseId, setIndex]
      properties:
        clientSetId:
          type: string
          format: uuid
          description: Client-generated id for offline idempotency
        exerciseId:
          type: string
          description: Catalog id from exercises.json
        setIndex:
          type: integer
          minimum: 0
        reps:
          type: integer
          minimum: 0
        weightKg:
          type: number
          format: float
        completed:
          type: boolean
          default: false
    SetLog:
      allOf:
        - $ref: '#/components/schemas/SetLogInput'
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
    SessionCreateRequest:
      type: object
      required: [workoutId, clientId]
      properties:
        workoutId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
          description: Client-generated session id for offline sync
    SessionSetsPatchRequest:
      type: object
      required: [sets]
      properties:
        sets:
          type: array
          items:
            $ref: '#/components/schemas/SetLogInput'
    WorkoutSession:
      type: object
      required:
        - id
        - workoutId
        - userId
        - clientId
        - status
        - sets
        - startedAt
      properties:
        id:
          type: string
          format: uuid
        workoutId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        status:
          type: string
          enum: [in_progress, completed]
        sets:
          type: array
          items:
            $ref: '#/components/schemas/SetLog'
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    SessionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutSession'
    InstructorSummary:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        bio:
          type: string
    InstructorListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InstructorSummary'
    AssignmentCreateRequest:
      type: object
      required: [instructorId, athleteId]
      properties:
        instructorId:
          type: string
          format: uuid
        athleteId:
          type: string
          format: uuid
    InstructorAssignment:
      type: object
      required: [id, instructorId, athleteId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        instructorId:
          type: string
          format: uuid
        athleteId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
security:
  - bearerAuth: []
